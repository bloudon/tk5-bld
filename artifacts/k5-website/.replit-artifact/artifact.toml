kind = "web"
previewPath = "/"
title = "Team K5 Website"
version = "1.0.0"
id = "artifacts/k5-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18612

[services.development]
run = "pnpm --filter @workspace/k5-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/k5-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/k5-website/dist/public"

[[services.production.rewrites]]
from = "/about"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/services"
to = "/services/index.html"

[[services.production.rewrites]]
from = "/pricing"
to = "/pricing/index.html"

[[services.production.rewrites]]
from = "/blog"
to = "/blog/index.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact/index.html"


[services.env]
PORT = "18612"
BASE_PATH = "/"
